# KrTxGNN - 韓國藥品老藥新用預測報告

# 基本設定
title: "KrTxGNN Drug Repurposing Reports"
description: "한국 MFDS 허가 의약품 약물재창출 예측 보고서"

url: "https://krtxgnn.yao.care"
baseurl: ""
lang: "ko"

# Jekyll 主題
remote_theme: just-the-docs/just-the-docs

# 插件
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# 搜尋功能
search_enabled: true
search:
  heading_level: 3

# 頁尾
footer_content: "Copyright &copy; 2026 藥提醒科技有限公司 (yao.care). 본 보고서는 연구 참고용이며 의학적 조언이 아닙니다."

# RSS Feed
feed:
  path: feed.xml
  posts_limit: 20

# Collections
collections:
  drugs:
    output: true
    permalink: /drugs/:name/
  news:
    output: true
    permalink: /news/:name/

# 預設值
defaults:
  - scope:
      path: ""
      type: "drugs"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "news"
    values:
      layout: "default"
  # 2026-11-03：SMART 啟動端點與應用殼（需從 EHR 啟動、沒有可收錄內容）不列入 sitemap；
  # 兩頁本身也有 <meta name="robots" content="noindex">。獨立測試頁 standalone.html 原本照常收錄，
  # 同日用戶決定也改成不收錄、不列入 sitemap（頁面照常可用，只是不進搜尋索引）。
  - scope:
      path: "smart/launch.html"
    values:
      sitemap: false
  - scope:
      path: "smart/app.html"
    values:
      sitemap: false
  - scope:
      path: "smart/standalone.html"
    values:
      sitemap: false

# Open Graph 設定
og_image: "/assets/images/og-default.png"

# 排除檔案
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "*.template"


