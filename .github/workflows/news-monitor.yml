name: 건강 뉴스 모니터

on:
  schedule:
    - cron: '0 */6 * * *'  # 6시간마다 실행
  workflow_dispatch:        # 수동 트리거

permissions:
  contents: write
  actions: write  # 推送後觸發 pages.yml（GITHUB_TOKEN 的 push 不會觸發其他 workflow）

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4 lxml

      - name: Check keywords.json
        run: |
          if [ ! -f data/news/keywords.json ]; then
            echo "키워드 목록 생성 중..."
            python scripts/generate_news_keywords.py
          fi

      - name: Fetch from Korea news sources
        run: python scripts/fetchers/korea_news.py

      - name: Process and generate pages
        run: python scripts/process_news.py

      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          [ -d data/news ] && git add data/news/*.json 2>/dev/null || true
          [ -d docs/_news ] && git add docs/_news/
          [ -f docs/data/news-index.json ] && git add docs/data/news-index.json || true
          [ -f docs/_data/drug_news.json ] && git add docs/_data/drug_news.json || true

          if git diff --staged --quiet; then
            echo "뉴스 업데이트 없음"
          else
            git commit -m "건강 뉴스 업데이트 $(date +%Y-%m-%d-%H%M)"
            git push
            gh workflow run pages.yml --ref main || echo "Pages dispatch failed"
          fi
